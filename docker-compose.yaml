services:

  api:
    build:
      context: .
      dockerfile: "./api/Dockerfile"
    volumes:
      - "./logs:/src/logs"
    ports:
      - "8000:8000"
    networks:
      - bytebattles_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    restart: always
    env_file:
      - .env

  judge:
    build:
      context: .
      dockerfile: "./judge/Dockerfile"
    volumes:
      - "./logs:/src/logs"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bytebattles_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    restart: always
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "bytebattles_postgres:/var/lib/postgresql/data"
    networks:
      - bytebattles_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    networks:
      - bytebattles_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -s3.port=8333 -dir=/data"
    volumes:
      - "bytebattles_seaweedfs:/data"
    ports:
      - "8333:8333"
      - "9333:9333"
    networks:
      - bytebattles_net
    restart: always
    healthcheck:
      test: ["CMD", "weed", "version"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  seaweedfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - bytebattles_net
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in ${TESTCASE_BUCKET} ${SUBMISSION_BUCKET}; do
          until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b 2>/dev/null \
             || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b; do
            echo "waiting for seaweedfs S3..."; sleep 2
          done
          echo "bucket ready: $$b"
        done

volumes:
  bytebattles_postgres:
    name: bytebattles_postgres
    external: true
  bytebattles_seaweedfs:
    name: bytebattles_seaweedfs
    external: true

networks:
  bytebattles_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.115.0/24